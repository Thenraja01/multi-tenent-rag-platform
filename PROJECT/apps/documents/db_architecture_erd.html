async function render(key) {
  const wrap = document.getElementById('erd-wrap');
  wrap.innerHTML = '<p style="font-size:12px;color:var(--text-muted);padding:8px">Rendering...</p>';
  try {
    const {svg} = await mermaid.render('erd-'+key+'-'+Date.now(), diagrams[key]);
    wrap.innerHTML = svg;

    wrap.querySelectorAll('svg .node').forEach(node => {
      const firstPath = node.querySelector('path[d]');
      if (!firstPath) return;
      const d = firstPath.getAttribute('d');
      const nums = d.match(/-?[\d.]+/g)?.map(Number);
      if (!nums || nums.length < 8) return;
      const xs = [nums[0],nums[2],nums[4],nums[6]];
      const ys = [nums[1],nums[3],nums[5],nums[7]];
      const x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y;
      const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
      rect.setAttribute('x',x);rect.setAttribute('y',y);
      rect.setAttribute('width',w);rect.setAttribute('height',h);
      rect.setAttribute('rx','8');
      for(const a of['fill','stroke','stroke-width','class','style'])
        if(firstPath.hasAttribute(a)) rect.setAttribute(a,firstPath.getAttribute(a));
      firstPath.replaceWith(rect);
    });
    wrap.querySelectorAll('svg .row-rect-odd path, svg .row-rect-even path').forEach(p=>p.setAttribute('stroke','none'));
  } catch(e) {
    wrap.innerHTML = '<p style="color:var(--text-danger);font-size:12px;padding:8px">'+e.message+'</p>';
  }
}

window.show = function(key) {
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick').includes("'"+key+"'")));
  render(key);
};
