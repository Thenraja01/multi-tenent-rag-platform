# ==============================================================================
# NexusRAG Dynamic Multi-Tenant Reverse Proxy Configuration (NGINX)
# ==============================================================================
# Supports:
# 1. Platform SuperAdmin: platform.localfix.app, superadmin.localfix.app -> Next.js /superadmin
# 2. Dynamic Tenant Subdomains: *.localfix.app (e.g. supernova.localfix.app) -> Next.js /[tenant]
# 3. Direct API Gateway: api.localfix.app or /api/v1/* -> FastAPI backend (127.0.0.1:8000)
# 4. WebSocket Streaming & HMR: /ws/* and /_next/webpack-hmr with Hop-by-Hop upgrade
# ==============================================================================

# Upstream Backend Pool (FastAPI Uvicorn)
upstream nexusrag_api_upstream {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Upstream Frontend Pool (Next.js SSR/Edge App)
upstream nexusrag_frontend_upstream {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. Direct API Gateway Subdomain (api.localfix.app)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.localfix.app api.nexusrag.com;

    client_max_body_size 100M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;

    # CORS & Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # API Proxy
    location / {
        proxy_pass http://nexusrag_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    # WebSocket Proxy for RAG streaming & async notifications
    location /ws/ {
        proxy_pass http://nexusrag_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# ------------------------------------------------------------------------------
# 2. Platform SuperAdmin & Wildcard Multi-Tenant Subdomains (*.localfix.app)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name localfix.app *.localfix.app nexusrag.com *.nexusrag.com localhost;

    client_max_body_size 100M;

    # Proxy API requests directly to FastAPI backend
    location /api/v1/ {
        proxy_pass http://nexusrag_api_upstream/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
    }

    # Proxy WebSocket connections for Next.js HMR & API
    location /ws/ {
        proxy_pass http://nexusrag_api_upstream/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location /_next/webpack-hmr {
        proxy_pass http://nexusrag_frontend_upstream/_next/webpack-hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Static Assets Cache
    location /_next/static/ {
        proxy_pass http://nexusrag_frontend_upstream/_next/static/;
        proxy_cache_bypass $http_upgrade;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }

    # Frontend Application (Multi-Tenant Next.js Routing)
    location / {
        proxy_pass http://nexusrag_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
